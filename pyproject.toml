[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proofhouse"
version = "0.1.0"
description = "Personal research harness — makes it mechanically hard to fool yourself when testing hypotheses."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.7"
authors = [
    {name = "microtruths"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyyaml>=6.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/microtruths/proofhouse"
Repository = "https://github.com/microtruths/proofhouse"

[project.scripts]
proofhouse = "proofhouse.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["proofhouse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
